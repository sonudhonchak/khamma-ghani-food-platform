
name: COD Isolated Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: COD Security and Financial Audit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/never_connect
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Install Vitest
        run: npm install --no-save --package-lock=false vitest@3.2.4

      - name: Run COD and Financial Audit Tests
        run: npx vitest run apps/api/tests/deliveryCod.test.ts apps/api/tests/adminCod.test.ts

      - name: Check Backend TypeScript
        run: npm run typecheck -w @khamma-ghani/api

      - name: Build Backend API
        run: npm run build -w @khamma-ghani/api

      - name: Prepare original schema
        run: |
          git show origin/main:prisma/schema.prisma > /tmp/khamma-main-schema.prisma

      - name: Generate financial audit migration preview
        run: |
          npx prisma migrate diff \
            --from-schema=/tmp/khamma-main-schema.prisma \
            --to-schema=prisma/schema.prisma \
            --script \
            --output=step53-migration-preview.sql

      - name: Display migration preview
        run: |
          echo "=== SQL MIGRATION PREVIEW ONLY ==="
          cat step53-migration-preview.sql
          echo "=== NO DATABASE CHANGES APPLIED ==="

      - name: Save migration preview
        uses: actions/upload-artifact@v4
        with:
          name: step53-migration-preview
          path: step53-migration-preview.sql
          retention-days: 7
