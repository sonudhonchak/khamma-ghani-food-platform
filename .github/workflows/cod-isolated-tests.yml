
name: COD Isolated Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: COD Security and Frontend Build Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/never_connect
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Install Vitest
        run: npm install --no-save --package-lock=false vitest@3.2.4

      - name: Run COD security tests
        run: npx vitest run apps/api/tests/deliveryCod.test.ts

      - name: Check Frontend TypeScript
        run: npm run typecheck -w @khamma-ghani/web

      - name: Build Frontend
        run: npm run build -w @khamma-ghani/web

      - name: Confirm verification
        run: echo "Khamma Ghani frontend verification completed successfully."

      - name: Check Preview Login CORS
        run: |
          echo "=== PREVIEW DOMAIN ==="
          curl -sS -i --max-time 15 -X OPTIONS \
            "https://khamma-ghani-api.vercel.app/api/v1/auth/login" \
            -H "Origin: https://khamma-ghani-food-platform-git-step54-cod-frontend-sonu-f158.vercel.app" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            | grep -Ei '^HTTP/|^access-control-allow-origin:|^access-control-allow-methods:|^access-control-allow-headers:' || true

          echo "=== PRODUCTION DOMAIN ==="
          curl -sS -i --max-time 15 -X OPTIONS \
            "https://khamma-ghani-api.vercel.app/api/v1/auth/login" \
            -H "Origin: https://khamma-ghani-food-platform.vercel.app" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            | grep -Ei '^HTTP/|^access-control-allow-origin:' || true
