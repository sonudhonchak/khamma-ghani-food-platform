
name: COD Isolated Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Never use your production DATABASE_URL here
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/never_connect

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Install isolated test runner
        run: npm install --no-save --package-lock=false vitest@3.2.4

      - name: Run mocked COD tests
        run: npx vitest run apps/api/tests/deliveryCod.test.ts
