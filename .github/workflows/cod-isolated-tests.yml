
name: COD Isolated Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cod-security-and-backend-build-tests:
    name: COD Security and Backend Build Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Tests use mocked Prisma, never production DB.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/never_connect

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Install Vitest
        run: npm install --no-save --no-audit --no-fund vitest

      - name: Run COD, Restaurant Owner and Onboarding Security Tests
        run: >-
          npx vitest run
          apps/api/tests/deliveryCod.test.ts
          apps/api/tests/adminRestaurantOwners.test.ts
          apps/api/tests/adminRestaurantOnboardings.test.ts

      - name: Check Backend TypeScript
        run: npx tsc --noEmit --project apps/api/tsconfig.json

      - name: Build Backend API
        run: npm run build --prefix apps/api
