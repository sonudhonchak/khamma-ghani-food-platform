
name: COD Isolated Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: COD Security and Financial Audit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/never_connect
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Install Vitest
        run: npm install --no-save --package-lock=false vitest@3.2.4

      - name: Run COD and Financial Audit Tests
        run: npx vitest run apps/api/tests/deliveryCod.test.ts apps/api/tests/adminCod.test.ts
