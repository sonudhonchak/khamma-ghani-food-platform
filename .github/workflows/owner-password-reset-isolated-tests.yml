
name: Owner Password Reset Isolated Tests

on:
  push:
    branches:
      - step57-owner-password-reset
    paths:
      - '.github/workflows/owner-password-reset-isolated-tests.yml'
      - 'apps/api/src/routes/adminRestaurantOwnerPasswordReset.ts'
      - 'apps/api/src/app.ts'
      - 'apps/api/tests/adminRestaurantOwnerPasswordReset.test.ts'
      - 'apps/api/prisma/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/owner-password-reset-isolated-tests.yml'
      - 'apps/api/src/routes/adminRestaurantOwnerPasswordReset.ts'
      - 'apps/api/src/app.ts'
      - 'apps/api/tests/adminRestaurantOwnerPasswordReset.test.ts'
      - 'apps/api/prisma/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Deliberately unreachable test database.
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/never_connect

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Generate Prisma client without connecting to DB
        run: npm run db:generate

      - name: Install isolated test runner without lockfile changes
        run: npm install --no-save --package-lock=false vitest@3.2.4

      - name: Run password reset security tests
        run: npx vitest run apps/api/tests/adminRestaurantOwnerPasswordReset.test.ts

      - name: Check backend TypeScript
        run: npx tsc --noEmit --project apps/api/tsconfig.json
